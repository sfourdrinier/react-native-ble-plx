name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  package:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20.19.4

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package tests
        run: pnpm test:package

      - name: Run plugin tests
        run: pnpm test:plugin

      - name: Lint and typecheck
        run: pnpm lint

      - name: Build package artifacts
        run: pnpm prepack

  expo-cng-android:
    name: Expo CNG Android build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20.19.4

      - name: Setup Java
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Enable pnpm
        run: corepack enable

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Expo example dependencies
        run: pnpm --dir example-expo install --no-frozen-lockfile

      - name: Build package artifacts
        run: pnpm prepack

      - name: Typecheck Expo example
        run: pnpm --dir example-expo exec tsc --noEmit -p tsconfig.json

      - name: Run Expo Doctor
        working-directory: example-expo
        run: npx expo-doctor

      - name: Prebuild Expo native projects
        working-directory: example-expo
        run: npx expo prebuild --clean --no-install

      - name: Build generated Android project
        working-directory: example-expo/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
