# .github/workflows/ci.yml

name: CI

# Cost policy (#20):
# - package: every PR/master push (cheap Ubuntu)
# - expo-cng-android: only when Android/native-related paths change (or manual)
# - Apple (macOS): NOT on every PR commit. Runs on:
#     • push to master when Apple-related paths change
#     • pull_request with label `ci:apple` (opt-in before merge)
#     • workflow_dispatch (manual)
# Superseded runs for the same PR/branch are cancelled.

on:
  push:
    branches:
      - master
      - '4.0'
  pull_request:
    branches:
      - master
      - '4.0'
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:

# Official concurrency docs:
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
# Group includes workflow name so we never cancel publish.yml; PR number keeps
# each PR isolated; github.ref covers branch/tag pushes.
# Do not cancel in-progress CI when someone applies an unrelated PR label —
# that would replace a real package run with a skipped/success check (Codex P1).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci:apple') }}

# Hardened defaults: paths-filter needs pull-requests:read on pull_request events
# (dorny/paths-filter PR files API). Checkout needs contents:read.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Always run JS/package tests — including labeled events — so required checks
  # never get replaced by a skipped success from an unrelated label.
  # Multi-OS matrix: pure TS / Jest port+host tests run on Ubuntu, Windows, macOS.
  # Linux matrices Node 20.19.4 (engines floor), Node 22 (engines mid), Node 24 (publish line).
  # Job name is honest: lint/prepack/multi-host smoke run only on Linux (R2-F096).
  package:
    name: JS tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20.19.4'
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '20.19.4'
          - os: macos-latest
            node: '20.19.4'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package
        with:
          prepack: 'false'
          node-version: ${{ matrix.node }}

      - name: Run package tests
        run: pnpm test:package

      - name: Validate current evidence records
        run: pnpm validate:evidence

      - name: Run plugin tests
        run: pnpm test:plugin

      # Lint/typecheck + prepack once on Linux (path/tooling quirks differ on Windows)
      - name: Lint and typecheck
        if: runner.os == 'Linux'
        run: pnpm lint

      - name: Build package artifacts
        if: runner.os == 'Linux'
        run: pnpm prepack

      # L1 only: Fake multi-device demo under Node (not Electron binary / native radio).
      - name: Electron Fake multi-device demo smoke (L1)
        if: runner.os == 'Linux'
        run: node example-electron/smoke.js

      # R3-F075: full `pnpm test:package` above already covers BluezBlePort|ElectronNative|
      # OwnedCore|DeviceQueueAndLongWrite|CompatRegression|CodemodBytesPath — no re-run.

      # L2 needs compiled hosts (src/*.ts is not resolvable by plain Node). prepack is Linux-only above;
      # emit lib/ here before requireNative probes (R2-F005).
      - name: Build package artifacts (macOS/Windows L2 hosts)
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: pnpm prepack

      # L2: compile CoreBluetooth Node-API addon, then requireNative must succeed (no soft-pass).
      # Require compiled CJS only — never ./src/hosts/electron (TypeScript; Node cannot load it).
      - name: Electron CoreBluetooth native L2 (node-gyp Node ABI + requireNative)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          pnpm run build:electron:macos
          test -f native/electron/corebluetooth/build/Release/unified_ble_corebluetooth.node
          node -e "
            const { createCoreBluetoothBlePort } = require('./lib/commonjs/hosts/electron');
            const port = createCoreBluetoothBlePort({ requireNative: true });
            if (!port || typeof port.startScan !== 'function') {
              throw new Error('CoreBluetooth L2 requireNative did not return a BlePort');
            }
            console.log('Electron CoreBluetooth L2 ok:', port.id);
            if (typeof port.destroy === 'function') port.destroy();
          "

      # L3: Node ABI ≠ Electron ABI. Rebuild for Electron, then headless main-process smoke (R2-F037).
      # electron-main-smoke: Fake path always + CoreBluetooth requireNative under Electron on darwin (R3-F012).
      # Not radio L4 — no BrowserWindow, no live Polar. Non-darwin L3 remains Fake-only residual.
      - name: Electron ABI rebuild + main-process smoke (L3, Node ABI ≠ Electron ABI)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          npx --yes @electron/rebuild -f -w native/electron/corebluetooth
          ./node_modules/.bin/electron scripts/ci/electron-main-smoke.js

      # This is Node-API ABI and boundary-shape proof only. It does not claim a
      # live adapter, advertisement, peripheral, or radio-support result.
      - name: WinRT native boundary compile and ABI load (Windows; no live radio)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:electron:winrt
          test -f native/electron/winrt/build/Release/unified_ble_winrt.node
          node -e "
            const native = require('./native/electron/winrt');
            if (native.nativeProtocolVersion !== 1 || typeof native.createContractBoundary !== 'function') {
              throw new Error('WinRT addon does not expose boundary protocol v1');
            }
            const boundary = native.createContractBoundary();
            const required = [
              'listAdapters', 'selectAdapter', 'adapterSnapshot', 'startScan', 'stopScan',
              'connect', 'disconnect', 'discover', 'read', 'write', 'readDescriptor',
              'writeDescriptor', 'startNotify', 'stopNotify', 'onConnectionLost',
              'onDatabaseChanged', 'onAdapterState', 'destroy'
            ];
            for (const method of required) {
              if (typeof boundary[method] !== 'function') {
                throw new Error('WinRT boundary method is missing: ' + method);
              }
            }
            boundary.destroy().completion.then(() => {
              console.log('WinRT Node-API compile and ABI load passed; no live-radio test ran.');
            }, error => {
              console.error('WinRT native destroy after ABI load failed:', error);
              process.exitCode = 1;
            });
          "

      # L2 packaging: host export resolve after prepack; vite builds shared UI (radio is L4 lab).
      - name: Web host export + vite build smoke (L2)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          node scripts/ci/check-host-exports.js
          npx --yes vite build --config example-web/vite.config.js --outDir /tmp/example-web-dist

      # L3 wiring under Electron binary on Linux (Fake only; no BlueZ radio). Proves electron binary loads (R2-F037).
      - name: Electron main-process Fake smoke under Electron binary (L3, Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ./node_modules/.bin/electron scripts/ci/electron-main-smoke.js

      # BlueZ soft-probe: never silent success; skip explicitly when daemon/adapter absent (R2-F038 / GAP-CI-LIN).
      - name: BlueZ system soft-probe (L2/L3 soft; mock Jest remains L1)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if ! command -v systemctl >/dev/null 2>&1; then
            echo "systemctl missing — skipped BlueZ L3 soft-probe (mock Jest remains L1)"
            exit 0
          fi
          if ! systemctl is-active --quiet bluetooth 2>/dev/null; then
            echo "bluetooth service inactive — skipped BlueZ L3 (mock Jest remains L1)"
            exit 0
          fi
          if command -v dbus-send >/dev/null 2>&1; then
            if ! dbus-send --system --dest=org.bluez --print-reply / org.freedesktop.DBus.Introspectable.Introspect >/dev/null 2>&1; then
              echo "BlueZ D-Bus soft-probe failed (daemon flagged active but no reply) — skipped L3"
              exit 0
            fi
          fi
          node scripts/ci/bluez-soft-probe.js

      # Real pack+install (not dry-run) — proves files allowlist + host/shim exports (R2-F039).
      - name: Dual npm pack + install export smoke
        if: runner.os == 'Linux'
        run: node scripts/ci/pack-install-smoke.js

      - name: Optional bytes-path codemod fixture check
        if: runner.os == 'Linux'
        run: pnpm test:codemod

  changes:
    name: Detect path changes
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:apple'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Filter paths
        # Latest: https://github.com/dorny/paths-filter/releases (v4 = Node 24 runtime)
        uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'plugin/**'
              - 'example/android/**'
              - 'example-expo/**'
              - 'app.plugin.js'
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            apple:
              - 'ios/**'
              - 'example/ios/**'
              - 'example/package.json'
              - 'example/**/Gemfile'
              - 'example/**/Gemfile.lock'
              - 'example-expo/**'
              - 'plugin/**'
              - 'app.plugin.js'
              - 'unified-ble-manager.podspec'
              - 'src/**'
              - 'scripts/ci/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/apple-ci.yml'
              - '.github/actions/**'
              - 'native/electron/**'
              - 'example-electron/**'

  expo-cng-android:
    name: Expo CNG Android build
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.android == 'true'
      )
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package

      - name: Setup Java
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Expo example dependencies
        run: pnpm --dir example-expo install --no-frozen-lockfile

      - name: Align Expo peer deps to installed SDK
        # package.json uses caret floors; let Expo pick compatible peers for the resolved SDK.
        working-directory: example-expo
        run: npx expo install --fix

      - name: Typecheck Expo example
        run: pnpm --dir example-expo exec tsc --noEmit -p tsconfig.json

      - name: Run Expo Doctor
        working-directory: example-expo
        run: npx expo-doctor

      - name: Prebuild Expo native projects
        working-directory: example-expo
        run: npx expo prebuild --clean --no-install

      - name: Build generated Android project
        working-directory: example-expo/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

  # Classic RN example Android compile — same android/ library sources as Expo,
  # wired through the bare example app (not only CNG). Gated by android path filter.
  classic-rn-android:
    name: Classic RN Android assemble
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.android == 'true'
      )
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # JetifyTransform of react-android AAR OOM'd on default heap (see CI logs).
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g\ -XX:MaxMetaspaceSize=1g\ -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package

      - name: Setup Java
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install classic example dependencies
        # example/.npmrc uses node-linker=hoisted so @react-native/gradle-plugin is at
        # example/node_modules/@react-native/gradle-plugin (required by settings.gradle).
        run: pnpm --dir example install --no-frozen-lockfile

      - name: Verify React Native gradle plugin path
        run: test -d example/node_modules/@react-native/gradle-plugin

      - name: Assemble classic example debug APK
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

  # --- Apple compile checks (#20) ---
  # Compile/link only. No simulator boot, no BLE runtime (see #14).
  # Expensive: gated by master/4.0 path changes, `ci:apple` label, or manual run.
  # 4.0 is included so owned CoreBluetooth + podspec changes are compile-checked before GA.
  # Implementation lives in reusable workflow apple-ci.yml + composite actions under
  # .github/actions/ (select-xcode, setup-js-package) so we do not triple-copy jobs.
  apple:
    name: Apple compile checks
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci:apple')
        ) ||
        (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/4.0') &&
          needs.changes.outputs.apple == 'true'
        )
      )
    uses: ./.github/workflows/apple-ci.yml
