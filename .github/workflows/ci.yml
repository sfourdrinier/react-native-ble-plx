name: CI

# Cost policy (#20):
# - package: every PR/master push (cheap Ubuntu)
# - expo-cng-android: only when Android/native-related paths change (or manual)
# - Apple (macOS): NOT on every PR commit. Runs on:
#     • push to master when Apple-related paths change
#     • pull_request with label `ci:apple` (opt-in before merge)
#     • workflow_dispatch (manual)
# Superseded runs for the same PR/branch are cancelled.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:

# Official concurrency docs:
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
# Group includes workflow name so we never cancel publish.yml; PR number keeps
# each PR isolated; github.ref covers branch/tag pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Skip whole-matrix noise when someone applies an unrelated label.
  package:
    name: Package checks
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:apple'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20.19.4

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package tests
        run: pnpm test:package

      - name: Run plugin tests
        run: pnpm test:plugin

      - name: Lint and typecheck
        run: pnpm lint

      - name: Build package artifacts
        run: pnpm prepack

  changes:
    name: Detect path changes
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:apple'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Filter paths
        # Latest: https://github.com/dorny/paths-filter/releases (v4 = Node 24 runtime)
        uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'plugin/**'
              - 'example/android/**'
              - 'example-expo/**'
              - 'app.plugin.js'
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            apple:
              - 'ios/**'
              - 'example/ios/**'
              - 'example/**/Gemfile'
              - 'example-expo/**'
              - 'plugin/**'
              - 'app.plugin.js'
              - 'react-native-ble-plx.podspec'
              - 'src/**'
              - 'scripts/ci/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  expo-cng-android:
    name: Expo CNG Android build
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.android == 'true'
      )
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20.19.4

      - name: Setup Java
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Enable pnpm
        run: corepack enable

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package artifacts
        run: pnpm prepack

      - name: Install Expo example dependencies
        run: pnpm --dir example-expo install --no-frozen-lockfile

      - name: Typecheck Expo example
        run: pnpm --dir example-expo exec tsc --noEmit -p tsconfig.json

      - name: Run Expo Doctor
        working-directory: example-expo
        run: npx expo-doctor

      - name: Prebuild Expo native projects
        working-directory: example-expo
        run: npx expo prebuild --clean --no-install

      - name: Build generated Android project
        working-directory: example-expo/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

  # --- Apple compile checks (#20) ---
  # Compile/link only. No simulator boot, no BLE runtime (see #14).
  # Expensive: gated by master path changes, `ci:apple` label, or manual run.

  ios-example:
    name: iOS example (BlePlxExample)
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci:apple')
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          needs.changes.outputs.apple == 'true'
        )
      )
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RCT_NEW_ARCH_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20.19.4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example

      - name: Enable pnpm
        run: corepack enable

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package artifacts
        run: pnpm prepack

      - name: Install example dependencies
        run: pnpm --dir example install

      - name: Install CocoaPods
        working-directory: example/ios
        run: BUNDLE_GEMFILE="$GITHUB_WORKSPACE/example/Gemfile" bundle exec pod install

      - name: Build BlePlxExample (iphonesimulator, New Arch)
        working-directory: example/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace BlePlxExample.xcworkspace \
            -scheme BlePlxExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

  ios-expo:
    name: iOS Expo CNG example
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci:apple')
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          needs.changes.outputs.apple == 'true'
        )
      )
    runs-on: macos-15
    timeout-minutes: 75
    env:
      RCT_NEW_ARCH_ENABLED: '1'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20.19.4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example

      - name: Enable pnpm
        run: corepack enable

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package artifacts
        run: pnpm prepack

      - name: Install Expo example dependencies
        run: pnpm --dir example-expo install --no-frozen-lockfile

      - name: Prebuild Expo native projects
        working-directory: example-expo
        run: npx expo prebuild --clean --no-install --platform ios

      - name: Install CocoaPods
        working-directory: example-expo/ios
        run: |
          set -euo pipefail
          # Reuse the same CocoaPods pins as the non-Expo example Gemfile.
          BUNDLE_GEMFILE="$GITHUB_WORKSPACE/example/Gemfile" bundle exec pod install

      - name: Build Expo iOS app (iphonesimulator, New Arch)
        working-directory: example-expo/ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          if [[ -z "$WORKSPACE" ]]; then
            echo "error: no .xcworkspace after prebuild" >&2
            exit 1
          fi
          # Prefer an app scheme (contains example); skip CocoaPods aggregate schemes.
          # One-line python keeps this valid YAML (multi-line -c '...' breaks the block scalar).
          SCHEME=$(
            xcodebuild -list -workspace "$WORKSPACE" -json \
              | python3 -c "import json,sys; d=json.load(sys.stdin); s=(d.get('workspace') or d.get('project') or {}).get('schemes') or []; p=[x for x in s if 'example' in x.lower() and 'pod' not in x.lower()]; print((p or s)[0] if s else '')"
          )
          if [[ -z "$SCHEME" ]]; then
            echo "error: could not resolve xcode scheme from $WORKSPACE" >&2
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

  tvos-library:
    name: tvOS library compile check
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci:apple')
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          needs.changes.outputs.apple == 'true'
        )
      )
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Select Xcode
        run: xcodebuild -version

      - name: Check tvOS library (podspec + vendor Swift)
        run: bash scripts/ci/check-tvos-library.sh
