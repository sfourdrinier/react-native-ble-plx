# Publish @sfourdrinier/react-native-ble-plx with npm Trusted Publishing (OIDC)
# and automatic provenance attestations.
#
# Prerequisites (one-time):
# 1. GitHub Environment named "npm" (optional: required reviewers).
# 2. npm Trusted Publisher for this package:
#    Organization/user: sfourdrinier
#    Repository:        react-native-ble-plx
#    Workflow filename: publish.yml
#    Environment name:  npm
#    Allowed actions:   npm publish
#    https://www.npmjs.com/package/@sfourdrinier/react-native-ble-plx/access
#
# Release flow: merge release PR → manually tag vX.Y.Z on master → push tag →
# approve npm environment if required → this workflow publishes to npm with
# provenance, then creates the GitHub Release. Tags stay manual. See RELEASE.md.

name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # GitHub Release after successful publish
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.0

      # Trusted publishing: Node ≥22.14.0, npm ≥11.5.1
      # (https://docs.npmjs.com/trusted-publishers).
      # Do NOT set registry-url here: actions/setup-node writes
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} which breaks OIDC
      # (empty token → ENEEDAUTH; dummy token → 404). See:
      # https://github.com/actions/setup-node/issues/1551
      # https://github.com/npm/documentation/issues/1960
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          # Pin npm 11.x (docs floor 11.5.1). Avoid npm@latest (12.x engines differ).
          # Node 24 LTS currently ships npm 11.x (e.g. v24.18.0 → 11.16.0).
          npm install -g 'npm@^11.5.1'
          node --version
          npm --version
          # Prove OIDC env is present (GitHub always sets these on GHA).
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "ACTIONS_ID_TOKEN_REQUEST_URL missing — OIDC will not work"
            exit 1
          }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN missing — OIDC will not work"
            exit 1
          }

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package tests
        run: pnpm test:package

      - name: Run plugin tests
        run: pnpm test:plugin

      - name: Lint and typecheck
        run: pnpm lint

      - name: Build package artifacts
        run: pnpm prepack

      - name: Inspect npm pack contents
        run: npm pack --dry-run

      - name: Guard — package version must match git tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi
          echo "Publishing ${PKG} from tag ${GITHUB_REF_NAME}"

      # Soft check so a re-run after npm success can still create the GitHub Release.
      - name: Check whether version is already on npm
        id: npm_status
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          if npm view "@sfourdrinier/react-native-ble-plx@${VER}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VER} is already on npm — will skip publish and continue to GitHub Release"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VER} is not on npm yet"
          fi

      # Do NOT set NODE_AUTH_TOKEN at all (even to empty). Empty token prevents
      # OIDC and yields ENEEDAUTH. Dummy token from setup-node yields 404.
      # Trusted Publishing uses GitHub OIDC automatically with id-token: write.
      - name: Publish to npm (OIDC + provenance)
        if: steps.npm_status.outputs.already_published != 'true'
        run: npm publish --provenance --access public

      # Tags remain manual. After npm succeeds, create the GitHub Release from
      # CHANGELOG.md notes so the Releases page matches the published package.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists — skipping"
            exit 0
          fi

          NOTES_FILE="$(mktemp)"
          {
            echo "## ${TAG}"
            echo
            BODY="$(awk -v ver="${VER}" '
              $0 ~ ("^## \\[" ver "\\]") { p = 1; next }
              p && $0 ~ /^## \[/ { exit }
              p { print }
            ' CHANGELOG.md)"
            if [ -n "${BODY}" ]; then
              printf '%s\n' "${BODY}"
            else
              echo "See CHANGELOG.md for ${TAG} details."
            fi
            echo
            echo "npm: \`@sfourdrinier/react-native-ble-plx@${VER}\` (published with provenance)"
          } > "${NOTES_FILE}"

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${NOTES_FILE}" \
            --verify-tag

          echo "Created GitHub Release ${TAG}"
          rm -f "${NOTES_FILE}"
