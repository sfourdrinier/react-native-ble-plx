# .github/workflows/publish.yml
# Publish the canonical unified-ble-manager 4.0 package with npm Trusted
# Publishing (OIDC) and provenance.
#
# Prerequisites (one-time):
# 1. GitHub Environment named "npm" (optional: required reviewers).
# 2. npm Trusted Publisher for unified-ble-manager:
#    Organization/user: sfourdrinier
#    Repository:        react-native-ble-plx
#    Workflow filename: publish.yml
#    Environment name:  npm
#    Allowed actions:   npm publish
#    https://www.npmjs.com/package/unified-ble-manager/access
#
# Release flow: merge release PR → manually tag vX.Y.Z on master → push tag →
# approve npm environment if required → this workflow publishes the package
# with provenance, then creates the GitHub Release. Tags stay manual. See RELEASE.md.
#
# GA gates (Ubuntu): package/plugin/lint/prepack, electron Fake L1 smoke, host
# export resolution, classic RN Android assemble, Expo CNG
# prebuild+assemble, canonical npm pack dry-run. Apple compile remains a pre-merge
# gate (ci:apple on the release PR / master path filter) — not re-run here.
# Align with scripts/verify-release.sh (R2-F040).

name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # GitHub Release after successful publish
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  publish:
    name: Publish canonical package
    runs-on: ubuntu-latest
    environment: npm
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g\ -XX:MaxMetaspaceSize=1g\ -Dfile.encoding=UTF-8

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.0

      # Trusted publishing: Node ≥22.14.0, npm ≥11.5.1.
      # npm's current GitHub Actions guidance requires an explicit registry URL;
      # npm then exchanges the job's OIDC identity during `npm publish`.
      # Do not provide NODE_AUTH_TOKEN; trusted publishing must not fall back to
      # a long-lived credential. https://docs.npmjs.com/trusted-publishers/
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          # Pin npm 11.x (docs floor 11.5.1). Avoid npm@latest (12.x engines differ).
          # Node 24 LTS currently ships npm 11.x (e.g. v24.18.0 → 11.16.0).
          npm install -g 'npm@^11.5.1'
          node --version
          npm --version
          # Prove OIDC env is present (GitHub always sets these on GHA).
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "ACTIONS_ID_TOKEN_REQUEST_URL missing — OIDC will not work"
            exit 1
          }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN missing — OIDC will not work"
            exit 1
          }

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package tests
        run: pnpm test:package

      - name: Validate current evidence records
        run: pnpm validate:evidence

      - name: Run plugin tests
        run: pnpm test:plugin

      - name: Lint and typecheck
        run: pnpm lint

      - name: Build package artifacts
        run: pnpm prepack

      # Multi-host GA smoke (Ubuntu): Fake L1 electron, host export resolution,
      # classic Android, Expo CNG Android. Apple compile is pre-merge only.
      - name: Electron Fake multi-device demo smoke (L1)
        run: node example-electron/smoke.js

      - name: Canonical host export resolve (L2 packaging)
        run: |
          set -euo pipefail
          node scripts/ci/check-host-exports.js

      - name: Setup Java (classic RN + Expo CNG Android assemble)
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install classic example dependencies
        run: pnpm --dir example install --no-frozen-lockfile

      - name: Assemble classic RN Android debug APK
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

      # Align with verify-release.sh Expo CNG gate (R2-F040) — publish always ran classic only.
      - name: Install Expo example dependencies
        run: pnpm --dir example-expo install --no-frozen-lockfile

      - name: Align Expo peer deps to installed SDK
        working-directory: example-expo
        run: npx expo install --fix

      - name: Typecheck Expo example
        run: pnpm --dir example-expo exec tsc --noEmit -p tsconfig.json

      - name: Run Expo Doctor
        working-directory: example-expo
        run: npx expo-doctor

      - name: Prebuild Expo native projects
        working-directory: example-expo
        run: npx expo prebuild --clean --no-install

      - name: Assemble Expo CNG Android debug APK
        working-directory: example-expo/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      # R3-F044: same canonical pack+install export smoke as PR CI / verify-release
      - name: Canonical pack+install export smoke
        run: node scripts/ci/pack-install-smoke.js

      - name: Inspect canonical npm pack contents
        run: |
          set -euo pipefail
          npm pack --dry-run

      - name: Guard — canonical package version must match git tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          ROOT_VER="$(node -p "require('./package.json').version")"
          ROOT_NAME="$(node -p "require('./package.json').name")"
          if [ "$TAG" != "$ROOT_VER" ]; then
            echo "Tag v${TAG} does not match root package.json version ${ROOT_VER}"
            exit 1
          fi
          if [ "$ROOT_NAME" != "unified-ble-manager" ]; then
            echo "Root package name must be unified-ble-manager, got ${ROOT_NAME}"
            exit 1
          fi
          if [[ "$ROOT_VER" == *-* ]]; then
            echo "NPM_DIST_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV"
          fi
          echo "Publishing ${ROOT_NAME}@${ROOT_VER} from tag ${GITHUB_REF_NAME}"

      # Soft check so a re-run after npm success can still create the GitHub Release.
      - name: Check whether versions are already on npm
        id: npm_status
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          PACKAGE_PUBLISHED=false
          if npm view "unified-ble-manager@${VER}" version >/dev/null 2>&1; then
            PACKAGE_PUBLISHED=true
            echo "unified-ble-manager@${VER} is already on npm"
          else
            echo "unified-ble-manager@${VER} is not on npm yet"
          fi
          echo "package_published=${PACKAGE_PUBLISHED}" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGE_PUBLISHED" = true ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Canonical package already on npm — will skip publish and continue to GitHub Release"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Do NOT set NODE_AUTH_TOKEN. npm exchanges the GitHub OIDC identity for
      # this publish command; a long-lived token would defeat that boundary.
      - name: Publish unified-ble-manager (OIDC + provenance)
        if: steps.npm_status.outputs.package_published != 'true'
        run: npm publish --provenance --access public --tag "${NPM_DIST_TAG}"

      # Tags remain manual. After npm succeeds, create the GitHub Release from
      # CHANGELOG.md notes so the Releases page matches the published package.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists — skipping"
            exit 0
          fi

          NOTES_FILE="$(mktemp)"
          {
            echo "## ${TAG}"
            echo
            BODY="$(awk -v ver="${VER}" '
              $0 ~ ("^## \\[" ver "\\]") { p = 1; next }
              p && $0 ~ /^## \[/ { exit }
              p { print }
            ' CHANGELOG.md)"
            if [ -n "${BODY}" ]; then
              printf '%s\n' "${BODY}"
            else
              echo "See CHANGELOG.md for ${TAG} details."
            fi
            echo
            echo "### npm packages (published with provenance)"
            echo
            echo "- \`unified-ble-manager@${VER}\` — canonical product"
            echo "  - tarball: https://registry.npmjs.org/unified-ble-manager/-/unified-ble-manager-${VER}.tgz"
          } > "${NOTES_FILE}"

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${NOTES_FILE}" \
            --verify-tag

          echo "Created GitHub Release ${TAG}"
          rm -f "${NOTES_FILE}"
