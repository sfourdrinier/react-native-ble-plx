name: One-shot 4.x repository handoff

on:
  push:
    branches: [agent/point-4x-to-unified-ble-manager]

permissions:
  contents: write

jobs:
  handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: agent/point-4x-to-unified-ble-manager
      - name: Add canonical 4.x notice
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'README.md'
          const source = fs.readFileSync(path, 'utf8')
          const marker = '<!-- unified-ble-manager-4x-handoff -->'
          if (!source.includes(marker)) {
            const notice = `${marker}\n> [!IMPORTANT]\n> **Unified BLE Manager 4.x has moved to [sfourdrinier/unified-ble-manager](https://github.com/sfourdrinier/unified-ble-manager).**\n> This repository remains the historical and maintained home of the \`react-native-ble-plx\` 3.x line. New 4.x development, documentation, issues, and releases belong in the Unified BLE Manager repository.\n\n`
            fs.writeFileSync(path, notice + source)
          }
          NODE
          rm .github/workflows/point-4x-to-unified.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: point 4.x users to unified-ble-manager'
          git push origin HEAD:agent/point-4x-to-unified-ble-manager
