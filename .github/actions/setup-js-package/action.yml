name: Setup JS package
description: Node 20.19.4 + pnpm frozen install + optional prepack for library consumers in CI.
inputs:
  prepack:
    description: Run pnpm prepack after install
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: 20.19.4

    - name: Enable pnpm
      shell: bash
      run: corepack enable

    - name: Install root dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build package artifacts
      if: inputs.prepack == 'true'
      shell: bash
      run: pnpm prepack
